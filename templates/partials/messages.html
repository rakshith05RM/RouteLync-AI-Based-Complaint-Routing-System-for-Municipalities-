{% if messages %}
<div class="toast-container rp-toasts position-fixed top-0 end-0 p-3">
  {% for message in messages %}
  <div class="toast rp-toast rp-toast-{{ message.level_tag|default:'info' }} show" role="alert" aria-live="assertive" aria-atomic="true"
       data-bs-delay="6000">
    <div class="d-flex">
      <div class="toast-body">{{ message }}</div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Dismiss"></button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
