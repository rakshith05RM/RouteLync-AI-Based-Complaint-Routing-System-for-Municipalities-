{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="rp-error">
  <div class="rp-error-inner">
    <p class="rp-errcode">404</p>
    <h1>Page not found</h1>
    <p>We could not find that page. Check the address or return to the home page.</p>

      <a class="btn btn-rp" href="/"><i class="ic ic-home" aria-hidden="true"></i>Back to home</a>
    </div>
  </div>
</div>
{% endblock %}
